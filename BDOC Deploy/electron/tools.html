<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:11434">
<title>BDOC Tools and Offline AI</title>
<style>
  :root { --bg:#0E1116; --s1:#13171F; --s2:#181D26; --line:rgba(255,255,255,.08); --t1:#E6E9EE; --t2:#9BA1A8; --t3:#5C636B; --amber:#E8B349; --red:#DA3633; --ok:#3FB950; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--t1); font:13px/1.45 Inter,'Segoe UI',Arial,sans-serif; }
  main { display:grid; grid-template-columns:minmax(320px,420px) 1fr; height:100%; }
  section { display:flex; flex-direction:column; min-height:0; min-width:0; padding:16px; }
  section + section { border-left:1px solid var(--line); }
  h1 { margin:0 0 12px; font-size:12px; letter-spacing:.14em; font-weight:700; }
  h2 { margin:16px 0 4px; font-size:11px; letter-spacing:.1em; color:var(--t2); font-weight:600; }
  .scroll { overflow:auto; min-height:0; flex:1; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .row small { display:block; color:var(--t2); font-size:11px; }
  .row.off { opacity:.45; }
  .inputs { display:flex; gap:4px; }
  button, input, select, textarea { font:inherit; color:var(--t1); background:var(--s2); border:1px solid var(--line); border-radius:3px; padding:6px 10px; }
  button { cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { border-color:var(--amber); color:var(--amber); }
  button:disabled { cursor:default; opacity:.5; }
  input { width:68px; }
  pre { flex:0 0 26%; overflow:auto; margin:12px 0 0; padding:8px; min-height:80px; background:var(--s1); border:1px solid var(--line); border-radius:3px; font:11px/1.4 'JetBrains Mono',Consolas,monospace; white-space:pre-wrap; word-break:break-all; }
  #out-bar { display:flex; justify-content:flex-end; margin-top:6px; }
  #status { color:var(--t2); font:11px 'JetBrains Mono',Consolas,monospace; margin-bottom:8px; }
  #chat { background:var(--s1); border:1px solid var(--line); border-radius:3px; padding:12px; }
  .msg { margin:0 0 12px; padding-left:10px; border-left:2px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.ai { border-left-color:var(--amber); }
  .msg b { display:block; font-size:10px; letter-spacing:.1em; color:var(--t2); }
  form { display:flex; gap:8px; margin-top:8px; }
  textarea { flex:1; height:64px; resize:none; }
  .warn { color:var(--t3); font-size:11px; margin-top:6px; }
  select { max-width:100%; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>TOOL BRIDGE</h1>
    <div class="scroll">
      <h2>CHECKS</h2><div id="actions"></div>
      <h2>APPS</h2><div id="apps"></div>
    </div>
    <pre id="output">Results appear here.</pre>
    <div id="out-bar"><button id="toAI" disabled>Send result to AI</button></div>
  </section>
  <section>
    <h1>OFFLINE AI</h1>
    <div id="status">Starting...</div>
    <select id="model" aria-label="Model"></select>
    <div id="chat" class="scroll"></div>
    <form id="ask">
      <textarea id="prompt" placeholder="Ask anything. This runs on your laptop." aria-label="Message"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <div class="warn">Local AI makes mistakes. Double-check anything medical, electrical or safety-related. It cannot run tools.</div>
  </section>
</main>
<script src="tools-ui.js"></script>
</body>
</html>
