<!-- BDOC signup confirmation. Paste into Supabase: Authentication > Emails > Templates > Confirm signup.
     Subject: Confirm your BDOC account
     The "powered by Supabase" footer and the supabase.io sender only go away with custom SMTP. -->
<div style="margin:0;padding:32px 16px;background:#0E1116;font-family:Inter,Arial,sans-serif;color:#E6E9EE">
  <div style="max-width:480px;margin:0 auto;background:#13171F;border:1px solid #262C36;border-radius:3px;padding:32px">
    <p style="margin:0 0 24px;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#E8B349">KITSUNE BDOC</p>
    <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;color:#E6E9EE">Confirm your email</h1>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#9BA1A8">Confirm this address to finish setting up your BDOC account.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background:#E8B349;color:#0E1116;font-size:14px;font-weight:600;text-decoration:none;border-radius:3px">Confirm email</a>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#5C636B">If you did not sign up for BDOC, you can ignore this email.</p>
    <p style="margin:16px 0 0;font-size:12px;color:#5C636B">Kitsune Global Solutions LLC</p>
  </div>
</div>
