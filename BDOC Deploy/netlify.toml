[build]
  publish = "."
  functions = "netlify/functions"
  # Force a build on EVERY push. Netlify auto-cancels with "no content change in
  # base directory" (false-negative) which silently leaves the branch URL serving
  # stale assets. A non-zero exit from the ignore command forces a build every time.
  # NOTE: with base="BDOC Deploy" set in the ROOT netlify.toml, Netlify reads build
  # config from THIS file (inside the base dir), so the ignore rule MUST live here,
  # not in the root toml. Do not remove. (Root cause of stuck p36/p37, fixed 2026-06-12.)
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "18"
  # Do NOT install devDependencies (electron + electron-builder are desktop-only and
  # their ~150MB postinstall times out in CI, killing the build). Web build + functions
  # only need runtime deps (stripe, @supabase/supabase-js) from "dependencies".
  NPM_FLAGS = "--omit=dev"
  NODE_ENV = "production"

[functions]
  node_bundler = "esbuild"

# Redirect API calls to functions
# ─────────────────────────────────────────────────────────────────────────────
# P148: internal engineering docs must NOT be publicly served.
#
# HANDOFF.md and CLAUDE.md were reachable at https://kgsbdoc.netlify.app/HANDOFF.md
# (verified 200). They describe internal architecture, which subsystems are
# broken, which API keys are absent, that the mesh tables do not exist, and an
# operator's local filesystem path. For a product positioned as defense-grade
# intelligence tooling, publishing your own gap analysis is an own-goal — it is
# a roadmap for anyone probing the app.
#
# These files stay in the repo (that is the point — the agents read them from
# git), but Netlify must not serve them. 404, not 403: do not confirm existence.
[[redirects]]
  from = "/HANDOFF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE-SECURITY-TASK.md"
  to = "/404.html"
  status = 404
  force = true

# Internal docs, SQL migrations, and operator tooling.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH_READINESS_AUDIT.md"
  to = "/404.html"
  status = 404
  force = true

# Operator tooling. This one shipped a hardcoded mem0 key and was served at 200 (2026-10-13).
[[redirects]]
  from = "/mem0_importer.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# p158 SOURCE DISCLOSURE — Netlify publishes the whole base directory, so every
# server-side file was readable over HTTPS. Confirmed live before this change:
#   /package.json                                200
#   /package-lock.json                           200  (full dependency graph)
#   /supabase/migrations/001_initial_schema.sql  200  (RLS POLICIES)
#   /supabase/migrations/002_*.sql               200
#   /netlify/functions/_supabase.js              200
#   /netlify/functions/_lib/guard.js             200  (the auth logic itself)
#   /netlify/functions/stripe-webhook.js         200  (payment handling)
#   /electron/main.js, /electron/preload.js      200
#   /tests/guard.test.js                         200
# No hardcoded secrets were in them (env vars only) — but handing an attacker
# the RLS policies and the exact auth checks is free reconnaissance. The
# functions still RUN normally; only their source text stops being served.
# Pattern copied from the p148 /mem0_importer.py block.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/electron/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# SECURITY.md is the ONE markdown file that must stay public — CISA Secure by
# Design goal 5 (vulnerability disclosure policy). Served at a clean URL too,
# because /.well-known/security.txt points at it and a dead Policy: line is
# worse than no security.txt at all. Listed BEFORE the /*.md catch-all, since
# Netlify applies the first matching rule.
[[redirects]]
  from = "/security-policy"
  to = "/SECURITY.md"
  status = 200

[[redirects]]
  from = "/SECURITY.md"
  to = "/SECURITY.md"
  status = 200

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=self allows the page itself to call navigator.geolocation.
    # geolocation=() was blocking GPS entirely at the HTTP header level.
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    # Phase 24 (2026-05-23): enforce HTTPS-only for all connections.
    # max-age=1 year; includeSubDomains so any future subdomains inherit the policy.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # p158: cross-origin isolation. COOP severs the window.opener link, so a
    # page we open (or that opens us) cannot reach back into this window —
    # closes the reverse-tabnabbing path to the Supabase session in localStorage.
    Cross-Origin-Opener-Policy = "same-origin"
    # Our own documents/JSON must not be embeddable by other sites.
    # NOT applied to /assets or tiles, which are meant to be cross-origin.
    Cross-Origin-Resource-Policy = "same-site"

    # p158: CSP in REPORT-ONLY first — deliberately not enforcing yet.
    # index.html carries a ~767 KB inline <script> plus 1,663 inline style=
    # attributes, so enforcing a strict policy today would blank the app. This
    # collects real violations at /.netlify/functions/csp-report for a week;
    # then the allowlist gets tightened and the header is renamed to
    # Content-Security-Policy.
    # 'unsafe-eval' is required by Cesium's bundled Knockout and cannot be
    # removed until Cesium drops it upstream.
    # The value of report-only TODAY is connect-src visibility: we will see
    # every host the page actually talks to, which is how an injected
    # exfiltration endpoint would announce itself.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: http://127.0.0.1:9876 http://localhost:9876 ws://127.0.0.1:9090; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://www.broadcastify.com https://www.youtube.com https://player.twitch.tv; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /.netlify/functions/csp-report"

# Server-side source must never be cached by a CDN edge as a 200 either.
[[headers]]
  for = "/netlify/*"
  [headers.values]
    Cache-Control = "no-store"

# Phase 4A.1 (2026-05-04): aggressive caching for immutable static assets
# Lazy-loaded modules use ?v= cache-bust query strings, so 1-year cache is safe
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# index.html: short cache so updates land within minutes
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
